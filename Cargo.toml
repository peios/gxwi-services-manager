[package]
name = "gxwi-services-manager"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# libgxwi as of the gxwi release dev.peios.gxwi-sdk stages, which a package
# build takes it from (gxwi's dev/pins.toml).
libgxwi = { git = "https://github.com/peios/gxwi.git", rev = "5629140add3de075511b3379fd690fdabd06dcaf" }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "f8c84930f2b71763bcf0550df0b1420a0f63b21e", package = "peios" }
# What peinit offers a program that manages services (`peinit::client`),
# and nothing of its own runtime: its features would bring in another
# revision of `peios`.
peinit2 = { git = "https://github.com/peios/peinit.git", rev = "0ee3ea3c15e0b17e1aed887764bf5e3d6242bde3", default-features = false }
# The permissions editor's protocol, and nothing of its program.
gxwi-sd-editor = { git = "https://github.com/peios/gxwi-sd-editor.git", rev = "27239eb3411ab82d711262bfd59e537c66c29e9e", default-features = false, features = ["splice", "registry"] }
# A timer's times, which peinit gives in UTC, said on this machine's clock.
# The one peinit's calendar uses.
jiff = "0.2.29"

[dev-dependencies]
serde_json = "1"
