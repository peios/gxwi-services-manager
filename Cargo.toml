[package]
name = "gxwi-services-manager"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The dialog role is not in a released libgxwi yet: until it is, the one
# beside this checkout.
libgxwi = { path = "../gxwi/libgxwi" }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "3cf23f68d40c4adff252e28241bb3c958fba824f", package = "peios" }
# What peinit offers a program that manages services (`peinit::client`),
# and nothing of its own runtime: its features would bring in another
# revision of `peios`. Beside this checkout until it is pushed.
peinit2 = { path = "../peinit", default-features = false }
# The permissions editor's protocol, and nothing of its program. Beside this
# checkout until it is pushed.
gxwi-sd-editor = { path = "../gxwi-sd-editor", default-features = false, features = ["splice"] }
# A timer's times, which peinit gives in UTC, said on this machine's clock.
# The one peinit's calendar uses.
jiff = "0.2.29"

[dev-dependencies]
serde_json = "1"
